# Single source of truth for data, sources, jurisdictions and the as-of date (P8).
# No jurisdiction names or file names are hard-coded in logic; change them here.
as_of_date: "2026-11-02"

jurisdictions:
  - Avalon
  - Calder
  - Meridian

policies:
  main_pair:
    policy_family: regional-dol-payroll-bulletin
    old: data/policies/gov_rules_v1.txt
    new: data/policies/gov_rules_v2.txt
    old_pdf: data/policies/gov_rules_v1.pdf
    new_pdf: data/policies/gov_rules_v2.pdf
  company_pair:
    policy_family: larkspur-pay-policy
    old: data/company_policies/company_pay_policy_v1.txt
    new: data/company_policies/company_pay_policy_v2.txt
    pdf: data/company_policies/company_pay_policy.pdf

employees: data/employees.csv

sources:
  - name: Policy site
    kind: policy_site
    path: data/policy_site
    unpublished: data/policy_site/_unpublished
    policy_family: regional-dol-payroll-bulletin
    trusted: true
  - name: Company policies
    kind: folder
    path: data/company_policies
    trusted: true
  - name: Manual upload
    kind: upload
    trusted: true
  - name: Federal Register
    kind: federal_register
    url: https://www.federalregister.gov/api/v1
    trusted: false

# The fictional site the agent watches. Held-back versions are published in this order (file stems).
site:
  dir: data/policy_site
  unpublished_dir: data/policy_site/_unpublished
  index_file: data/policy_site/index.json
  release_order:
    - gov_rules_v3

# Saved state that reset() clears. Both files are gitignored.
state:
  database: maya.db
  fingerprints: .maya_fingerprints.json

# Pre-approve is the default: findings that pass the rule stay pending until a person signs off.
routing:
  approval_mode: pre_approve

# Matching rule R4: a reporting rule containing any of these terms is about future hires
# and matches no current employee. Case-insensitive.
matching:
  new_hire_terms:
    - "newly hired"

# Groq models (B9) and where saved runs are kept for replay. Free-tier Groq only.
llm:
  reader_model: openai/gpt-oss-120b
  planner_model: openai/gpt-oss-20b
  replay_dir: data/replays
